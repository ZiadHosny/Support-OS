components:
  schemas:
    ActionEnum:
      enum:
      - user_created
      - user_role_changed
      - user_status_changed
      - user_deleted
      - role_created
      - role_renamed
      - role_permissions_changed
      - role_deleted
      - portal_access_granted
      - portal_access_revoked
      - two_factor_enabled
      - two_factor_disabled
      - two_factor_reset
      - two_factor_recovery_code_used
      - data_retention_run
      - customer_data_exported
      - customer_data_erased
      type: string
      description: |-
        * `user_created` - User created
        * `user_role_changed` - User role changed
        * `user_status_changed` - User status changed
        * `user_deleted` - User deleted
        * `role_created` - Role created
        * `role_renamed` - Role renamed
        * `role_permissions_changed` - Role permissions changed
        * `role_deleted` - Role deleted
        * `portal_access_granted` - Portal access granted
        * `portal_access_revoked` - Portal access revoked
        * `two_factor_enabled` - Two-factor authentication enabled
        * `two_factor_disabled` - Two-factor authentication disabled
        * `two_factor_reset` - Two-factor authentication reset by admin
        * `two_factor_recovery_code_used` - Two-factor recovery code used
        * `data_retention_run` - Scheduled data retention run
        * `customer_data_exported` - Customer data exported
        * `customer_data_erased` - Customer data erased
    ApiKey:
      type: object
      description: |-
        Read shape, and the `POST` input shape. Never exposes `hashed_key`
        — `prefix` is the only key material a client ever sees again.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        user:
          type: integer
        user_email:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - updated_at
      - user
      - user_email
    ApiKeyIssued:
      type: object
      description: |-
        The `POST` response only. `key` is the plaintext, returned exactly
        once and unrecoverable afterward.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        user:
          type: integer
        user_email:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        key:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - key
      - last_used_at
      - name
      - prefix
      - updated_at
      - user
      - user_email
    ApiKeyRequest:
      type: object
      description: |-
        Read shape, and the `POST` input shape. Never exposes `hashed_key`
        — `prefix` is the only key material a client ever sees again.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        user:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
      - user
    ApiKeyUpdate:
      type: object
      description: |-
        `PATCH` shape. `user` is deliberately absent: re-pointing a live
        credential at a different identity silently changes what every caller
        holding it may do. Issue a new key instead.
      properties:
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          title: Active
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    Article:
      type: object
      description: |-
        Single inheritance point for every domain ModelSerializer.

        `TimeStampedModel` fields are server-managed, so they are read-only
        everywhere; declaring that once here keeps it out of every Meta block.

        Subclasses that define their own Meta must inherit this one for
        `read_only_fields` to apply:

            class CustomerSerializer(BaseModelSerializer):
                class Meta(BaseModelSerializer.Meta):
                    model = Customer
                    fields = ("id", "name", "created_at", "updated_at")
      properties:
        id:
          type: integer
          readOnly: true
        title_en:
          type: string
          title: Title (English)
          maxLength: 200
        title_ar:
          type: string
          title: Title (Arabic)
          maxLength: 200
        body_en:
          type: string
          title: Body (English)
        body_ar:
          type: string
          title: Body (Arabic)
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
          nullable: true
        category_color:
          type: string
          readOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body_ar
      - body_en
      - category_color
      - category_name
      - created_at
      - id
      - title_ar
      - title_en
      - updated_at
    ArticleCategory:
