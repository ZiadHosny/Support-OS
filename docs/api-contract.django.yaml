openapi: 3.0.3
info:
  title: SupportOS API
  version: 1.0.0
  description: 'Every response — success or failure — is wrapped in the same four-key
    envelope (`success`, `data`, `error`, `meta`); the schemas below already show
    the wrapped form. Authenticate either as a staff user with `Authorization: Bearer
    <JWT access token>` (POST /api/auth/token/) or as an external system with `Authorization:
    Api-Key <key>` (issued via POST /api/api-keys/). An API key carries exactly the
    permissions of the user it was issued for.'
paths:
  /api/api-keys/:
    get:
      operationId: api_keys_list
      description: |-
        API-key administration — INT-1. Gated entirely on
        `api_keys.manage`, which `accounts/0008_grant_api_keys_permission.py`
        grants to `admin` alone: a key inherits its user's whole permission
        set, so issuing one is as sensitive as editing a role.

        No `PUT`: `prefix`/`hashed_key` are immutable and `user` is
        deliberately not patchable, so a full replace has nothing coherent to
        mean. Narrows Django's own `View.http_method_names`, the same way
        `apps/customers/views.py:159` does.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api-keys
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKeyList'
          description: ''
        '400':
          description: Validation or parse error. `error.fields` maps field name to
            messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, malformed, expired, or revoked credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated, but the caller lacks the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such resource, or one outside the caller's scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unhandled server error. `error.debug` is present only when
            DEBUG is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: api_keys_create
      description: Returns the plaintext key in `data.key`. This is the only time
        it is ever returned — store it immediately.
      summary: Issue an API key
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - error
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/ApiKeyIssued'
                  error:
                    nullable: true
                  meta:
                    nullable: true
          description: ''
        '400':
          description: Validation or parse error. `error.fields` maps field name to
            messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, malformed, expired, or revoked credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated, but the caller lacks the required permission.
