        * `in_progress` - In progress
        * `pending_customer` - Waiting on customer
        * `resolved` - Resolved
        * `closed` - Closed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TwoFactorConfirmRequest:
      type: object
      description: |-
        SEC-9's enrolment-confirm step. `validate_code` only reads state —
        the same read-only `validate_*` discipline `ChangePasswordSerializer`
        above follows; `save()` is where `mfa_enabled` flips and recovery codes
        are actually issued, so a wrong code never has any side effect.
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 10
      required:
      - code
    TwoFactorDisableRequest:
      type: object
      description: |-
        SEC-9's self-service disable step. Requires the caller's current
        password — the same "a valid session alone is not proof of ownership"
        reasoning `ChangePasswordSerializer` documents for itself, applied to a
        toggle at least as sensitive as the password itself.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
    User:
      type: object
      description: |-
        Deliberately NOT `BaseModelSerializer` — that base exists for
        `TimeStampedModel`'s `created_at`/`updated_at`, which `User` does not
        have. See Story 08 `## Context` item 5.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        department:
          allOf:
          - $ref: '#/components/schemas/DepartmentBrief'
          readOnly: true
        branch:
          allOf:
          - $ref: '#/components/schemas/BranchBrief'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The SAME resolution the API enforces with, including the superuser
            bypass — `permissions_for` is the single source. Returning only
            role-derived permissions here would hide controls from a superuser
            that the API would happily allow. See CONVENTIONS.md §22.
          readOnly: true
        mfa_enabled:
          type: boolean
          readOnly: true
          title: Two-factor authentication enabled
        mfa_required:
          type: boolean
          description: |-
            Whether this account's role currently mandates 2FA — SEC-9's
            per-role enforcement. Independent of `mfa_enabled`: a required-but-
            not-yet-enrolled account has this True and `mfa_enabled` False,
            which is exactly the state `RequireAuth` (frontend) redirects on.
          readOnly: true
      required:
      - branch
      - department
      - email
      - id
      - is_staff
      - mfa_enabled
      - mfa_required
      - permissions
      - role
    UserAdmin:
      type: object
      description: |-
        CRUD over `User` for SEC-1's admin screen. Deliberately NOT
        `BaseModelSerializer` — `User` has no `created_at`/`updated_at`, the
        same reason `UserSerializer` above is not (Story 08 `## Context` item 5).

        `is_staff`/`is_superuser` are read-only and shown only for display (e.g.
        explaining why an account with `role: null` still has full access, per
        `/auth/me/`'s own superuser note in `permissions_for`) — granting either
        is a Django-admin-only action, never exposed through this API.

        No `password` field — SEC-5 replaced the admin-supplied password with
        an emailed invite link (`InviteConfirmSerializer` below). `create()`
        always produces an unusable password and an inactive account; the
        account becomes usable only through a successful invite confirm.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        mfa_enabled:
          type: boolean
          readOnly: true
          title: Two-factor authentication enabled
        role:
          type: integer
          nullable: true
        role_name:
          type: string
          readOnly: true
          nullable: true
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
          nullable: true
        branch:
          type: integer
          nullable: true
        branch_name:
          type: string
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - branch_name
      - date_joined
      - department_name
      - email
      - id
      - is_staff
      - is_superuser
      - last_login
      - mfa_enabled
      - role_name
    UserAdminRequest:
      type: object
      description: |-
        CRUD over `User` for SEC-1's admin screen. Deliberately NOT
        `BaseModelSerializer` — `User` has no `created_at`/`updated_at`, the
        same reason `UserSerializer` above is not (Story 08 `## Context` item 5).

        `is_staff`/`is_superuser` are read-only and shown only for display (e.g.
        explaining why an account with `role: null` still has full access, per
        `/auth/me/`'s own superuser note in `permissions_for`) — granting either
        is a Django-admin-only action, never exposed through this API.

        No `password` field — SEC-5 replaced the admin-supplied password with
        an emailed invite link (`InviteConfirmSerializer` below). `create()`
        always produces an unusable password and an inactive account; the
        account becomes usable only through a successful invite confirm.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
        role:
          type: integer
          nullable: true
        department:
          type: integer
          nullable: true
        branch:
          type: integer
          nullable: true
      required:
      - email
    WebhookDelivery:
      type: object
      description: |-
        Read-only history. `payload` is included — unlike `ErpOrder.raw`
        (Story 81, admin-only), a delivery's own outbound payload is exactly
        what an operator debugging a subscriber's rejection needs to see
        without leaving the UI.
      properties:
        id:
          type: integer
          readOnly: true
        subscription:
          type: integer
        event:
          type: string
          maxLength: 50
        payload: {}
        state:
          $ref: '#/components/schemas/WebhookDeliveryStateEnum'
        state_display:
          type: string
          readOnly: true
        attempt:
          type: integer
          maximum: 2147483647
          minimum: 0
        response_status_code:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        response_body:
          type: string
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - id
      - state
      - state_display
      - subscription
      - updated_at
    WebhookDeliveryStateEnum:
      enum:
      - success
      - retrying
      - failed
      type: string
      description: |-
        * `success` - Success
        * `retrying` - Retrying
        * `failed` - Failed
    WebhookSubscription:
      type: object
      description: |-
        Read/write over a `WebhookSubscription` row. `secret` is
        `write_only`, the same posture every other stored credential in this
        project takes; `has_secret` is what the UI renders instead.

        A blank/omitted `secret` on `PATCH` leaves the stored value untouched
        (`update` below) — the same contract `ErpConnectionSerializer`/the
        three `apps.communications` provider serializers already establish.
        Unlike those, `secret` **is** required on `create` — a subscription is
        created complete or not at all (see `WebhookSubscription`'s own
        docstring), so `validate` below enforces that only when `self.instance`
        is `None`.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        target_url:
          type: string
          format: uri
          maxLength: 500
        has_secret:
          type: boolean
          readOnly: true
        events: {}
        enabled:
          type: boolean
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - has_secret
      - id
      - name
      - target_url
      - updated_at
    WebhookSubscriptionRequest:
      type: object
      description: |-
        Read/write over a `WebhookSubscription` row. `secret` is
        `write_only`, the same posture every other stored credential in this
        project takes; `has_secret` is what the UI renders instead.

        A blank/omitted `secret` on `PATCH` leaves the stored value untouched
        (`update` below) — the same contract `ErpConnectionSerializer`/the
        three `apps.communications` provider serializers already establish.
        Unlike those, `secret` **is** required on `create` — a subscription is
        created complete or not at all (see `WebhookSubscription`'s own
        docstring), so `validate` below enforces that only when `self.instance`
        is `None`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        target_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        secret:
          type: string
          writeOnly: true
          maxLength: 255
        events: {}
        enabled:
          type: boolean
      required:
      - name
      - target_url
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    WhatsAppProviderConfig:
      type: object
      description: |-
        Read/write over the one `WhatsAppProviderConfig` row. Same
        write-only-credential contract as `EmailProviderConfigSerializer`
        above, applied to `access_token`.
      properties:
        id:
          type: integer
          readOnly: true
        api_base_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        phone_number_id:
          type: string
          maxLength: 100
        has_access_token:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - has_access_token
      - id
      - updated_at
    WorkingWindow:
      type: object
      description: |-
        CRUD over one `WorkingWindow`, scoped by `calendar` — the exact
        `ContactDetailSerializer` shape (apps/customers/serializers.py).
        `(calendar, weekday)`'s `UniqueConstraint` auto-derives a
        `UniqueTogetherValidator`, the same verified-safe DRF behaviour
        `ContactDetailSerializer`'s own docstring records.
      properties:
        id:
          type: integer
          readOnly: true
        calendar:
          type: integer
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: 0
          maximum: 32767
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - calendar
      - created_at
      - end_time
      - id
      - start_time
      - updated_at
      - weekday
    WorkingWindowRequest:
      type: object
      description: |-
        CRUD over one `WorkingWindow`, scoped by `calendar` — the exact
        `ContactDetailSerializer` shape (apps/customers/serializers.py).
        `(calendar, weekday)`'s `UniqueConstraint` auto-derives a
        `UniqueTogetherValidator`, the same verified-safe DRF behaviour
        `ContactDetailSerializer`'s own docstring records.
      properties:
        calendar:
          type: integer
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: 0
          maximum: 32767
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - calendar
      - end_time
      - start_time
      - weekday
    ErrorEnvelope:
      type: object
      required:
      - success
      - data
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        data:
          nullable: true
        error:
          type: object
          required:
          - code
          - message
          - fields
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: The submitted data is invalid.
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          nullable: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: An API key issued via `POST /api/api-keys/`, sent as `Api-Key <key>`.
        The key carries exactly the permissions of the user it was issued for.
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
