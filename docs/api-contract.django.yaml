    AuditLog:
      type: object
      description: |-
        Read-only — `AuditLogViewSet` has no write action for this to ever
        validate. `actor_name` uses the same verified-safe dotted-`source`
        pattern as `TicketSerializer.assigned_agent_name`
        (apps/tickets/serializers.py:33-35): `get_full_name` is a method, not a
        field, and DRF's `get_attribute` calls it; `allow_null=True` returns
        `None` instead of erroring when `actor` is `None` (a deleted actor).
        `target_label` is the snapshot field, not a dotted source on
        `target_user`/`target_role` — see `AuditLog`'s own docstring for why the
        snapshot exists.
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_name:
          type: string
          readOnly: true
          nullable: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        action_display:
          type: string
          readOnly: true
        target_user:
          type: integer
          nullable: true
        target_role:
          type: integer
          nullable: true
        target_customer:
          type: integer
          nullable: true
        target_label:
          type: string
          maxLength: 150
        from_value:
          type: string
        to_value:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - actor_name
      - created_at
      - id
      - target_label
