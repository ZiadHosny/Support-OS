          readOnly: true
        escalated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        merged_into:
          type: integer
          readOnly: true
          nullable: true
        merged_into_subject:
          type: string
          readOnly: true
          nullable: true
