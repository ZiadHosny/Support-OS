    PasswordResetConfirmRequest:
      type: object
      description: |-
        SEC-7's reset-confirm step — the forgot-password counterpart to
        `InviteConfirmSerializer`, above, with the precondition flipped: this
        only ever accepts an ALREADY-active account (`is_active=True`), never
        a pending one, and checks `password_fingerprint` equality instead of
        `has_usable_password()` for single-use — see `apps.accounts.tokens`'s
        own module docstring for why an active account needs a different
        single-use mechanism than a pending one.
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - token
    PasswordResetRequestRequest:
      type: object
      description: |-
        SEC-7's "forgot password" request step. Deliberately reveals
        nothing about whether `email` belongs to a real, active account:
        `save()` is a silent no-op for a non-existent, inactive, or
        already-unusable-password email — `PasswordResetRequestView` returns
        the identical `200` in every case, whatever `save()` did or didn't do.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedApiKeyUpdateRequest:
      type: object
      description: |-
        `PATCH` shape. `user` is deliberately absent: re-pointing a live
        credential at a different identity silently changes what every caller
        holding it may do. Issue a new key instead.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
          title: Active
        expires_at:
          type: string
          format: date-time
          nullable: true
    PatchedArticleCategoryRequest:
      type: object
      description: |-
        Single inheritance point for every domain ModelSerializer.

        `TimeStampedModel` fields are server-managed, so they are read-only
        everywhere; declaring that once here keeps it out of every Meta block.

        Subclasses that define their own Meta must inherit this one for
        `read_only_fields` to apply:

            class CustomerSerializer(BaseModelSerializer):
                class Meta(BaseModelSerializer.Meta):
                    model = Customer
                    fields = ("id", "name", "created_at", "updated_at")
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          oneOf:
          - type: string
            pattern: ^#(?:[0-9a-fA-F]{6})$
            maxLength: 7
          - type: string
            maxLength: 0
    PatchedArticleRequest:
      type: object
      description: |-
        Single inheritance point for every domain ModelSerializer.

        `TimeStampedModel` fields are server-managed, so they are read-only
        everywhere; declaring that once here keeps it out of every Meta block.

        Subclasses that define their own Meta must inherit this one for
        `read_only_fields` to apply:

            class CustomerSerializer(BaseModelSerializer):
                class Meta(BaseModelSerializer.Meta):
                    model = Customer
                    fields = ("id", "name", "created_at", "updated_at")
      properties:
        title_en:
          type: string
          minLength: 1
          title: Title (English)
          maxLength: 200
        title_ar:
          type: string
          minLength: 1
          title: Title (Arabic)
          maxLength: 200
        body_en:
          type: string
          minLength: 1
          title: Body (English)
        body_ar:
          type: string
          minLength: 1
          title: Body (Arabic)
        category:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/ArticleStatusEnum'
    PatchedBranchRequest:
      type: object
      description: |-
        CRUD over `Branch` — ORG-2's management screen. Shaped exactly like
        `DepartmentSerializer` above: the model field's own `unique=True` is
        what DRF derives the uniqueness validator from, so no hand-declared
        `UniqueValidator` is needed (contrast `CustomerSerializer.email`, which
        overrides the generated field and therefore must declare one —
        apps/customers/serializers.py:36-43).

        `calendar_name` mirrors `TicketSerializer.category_name`'s verified
        dotted-source + `allow_null=True` pattern — SLA-5 (Story 111).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
        calendar:
          type: integer
          nullable: true
          title: Business calendar
